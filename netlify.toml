[build]
  command = "npm run build"
  publish = "dist"

# Netlify serves generated static HTML files (e.g. /blog/1/index.html, /project/1/index.html)
# directly with their custom OpenGraph <head> tags, and falls back to /index.html for any other route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
